categories:
  - identity-management
  - contact-management

developmentStatus: stable
softwareType: standalone/backend

organisation:
  name: Entur AS
  uri: https://entur.no

usedBy:
  - Norway (nationwide), Entur

description:
  en:
    localisedName: Baba
    shortDescription: Organisation and user registry for the timetable data pipeline.
    longDescription: >
      Baba holds the organisations that deliver data, their users, and the roles and responsibility sets that
      decide who may do what. Other pipeline services query it to resolve permissions. Integrates with an OAuth2
      identity provider.
    documentation: https://github.com/entur/baba/blob/master/README.md
    features:
      - Registry of organisations, users and administrative zones
      - Role and responsibility model for authorisation
      - REST API used to resolve permissions
      - OAuth2 identity provider integration

